name: ☁️ Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_1:
        description: Deploy to Account 1
        required: false
        type: boolean
        default: true
      account_2:
        description: Deploy to Account 2
        required: false
        type: boolean
        default: false
      account_3:
        description: Deploy to Account 3
        required: false
        type: boolean
        default: false
      account_4:
        description: Deploy to Account 4
        required: false
        type: boolean
        default: false
      workernames:
        description: "Optional: Worker names in account order, comma-separated (e.g. name1,name2,name3,name4). Leave a slot empty to use the default."
        required: false
        default: ""
      proxyip:
        description: "Optional: Enter a specific Proxy IP/host for this run"
        required: false
        default: di.nscl.ir
      uuid:
        description: "Optional: Enter a specific UUID for this run (leave blank to generate a random one)"
        required: false
        default: ""
      enable_gemini:
        description: "Unlock Google AI Studio & Gemini (Note: ping may be slightly higher)"
        required: false
        type: boolean
        default: false
        
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: ⬜ Build account matrix
        id: build
        env:
          EVENT: ${{ github.event_name }}
          SEL_1: ${{ inputs.account_1 }}
          SEL_2: ${{ inputs.account_2 }}
          SEL_3: ${{ inputs.account_3 }}
          SEL_4: ${{ inputs.account_4 }}
        run: |
          ITEMS="[]"
          add() { ITEMS=$(echo "$ITEMS" | jq --argjson n "$1" '. + [{"index": $n}]'); }

          if [ "$EVENT" != "workflow_dispatch" ]; then
            add 1
          else
            [ "$SEL_1" = "true" ] && add 1
            [ "$SEL_2" = "true" ] && add 2
            [ "$SEL_3" = "true" ] && add 3
            [ "$SEL_4" = "true" ] && add 4
          fi

          if [ "$(echo "$ITEMS" | jq 'length')" = "0" ]; then
            echo "::error::No Cloudflare account selected - tick at least one account checkbox and re-run."
            exit 1
          fi

          echo "matrix=$(echo "$ITEMS" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: ⬜ Checkout code
        uses: actions/checkout@v7

      - name: ⬜ Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: ⬜ Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: ⬜ Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: ⬜ Resolve account credentials (#${{ matrix.index }})
        id: account
        env:
          API_TOKEN: ${{ matrix.index == 1 && secrets.CLOUDFLARE_API_TOKEN || secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.index)] }}
          ACCOUNT_ID: ${{ matrix.index == 1 && secrets.CLOUDFLARE_ACCOUNT_ID || secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.index)] }}
          ACCOUNT_LABEL: ${{ matrix.index == 1 && vars.CLOUDFLARE_ACCOUNT_LABEL || vars[format('CLOUDFLARE_ACCOUNT_{0}_LABEL', matrix.index)] }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            if [ "${{ matrix.index }}" = "1" ]; then
              TOKEN_NAME="CLOUDFLARE_API_TOKEN"
              ID_NAME="CLOUDFLARE_ACCOUNT_ID"
            else
              TOKEN_NAME="CLOUDFLARE_API_TOKEN_${{ matrix.index }}"
              ID_NAME="CLOUDFLARE_ACCOUNT_ID_${{ matrix.index }}"
            fi
            echo "::error::Account #${{ matrix.index }} is selected but its $TOKEN_NAME / $ID_NAME secrets aren't set."
            exit 1
          fi
          LABEL="${ACCOUNT_LABEL:-Account ${{ matrix.index }}}"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: ⬜ Resolve UUID
        id: uuidval
        env:
          INPUT_UUID: ${{ inputs.uuid }}
          SECRET_UUID: ${{ secrets[format('UUID_{0}', matrix.index)] || secrets.UUID }}
        run: |
          UUID_REGEX="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          FALLBACK_UUID="be0ff9df-1468-41a0-8865-796d1c6800db"

          if [ -n "$INPUT_UUID" ]; then
            UUID_VALUE="$INPUT_UUID"
          elif [ -n "$SECRET_UUID" ]; then
            UUID_VALUE="$SECRET_UUID"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UUID_VALUE=$(cat /proc/sys/kernel/random/uuid)
          else
            echo "::warning::UUID secret not set, using public fallback"
            UUID_VALUE="$FALLBACK_UUID"
          fi

          if ! [[ "$UUID_VALUE" =~ $UUID_REGEX ]]; then
            echo "::warning::Invalid UUID provided, using public fallback"
            UUID_VALUE="$FALLBACK_UUID"
          fi

          echo "::add-mask::$UUID_VALUE"
          UUID_SUFFIX="${UUID_VALUE: -4}"
          UUID_MASKED="••••••••-••••-••••-$UUID_SUFFIX"
          echo "uuid_masked=$UUID_MASKED" >> "$GITHUB_OUTPUT"
          echo "uuid=$UUID_VALUE" >> "$GITHUB_OUTPUT"

      - name: ⬜ Resolve ProxyIP
        id: proxyval
        env:
          INPUT_PROXYIP: ${{ inputs.proxyip }}
          SECRET_PROXYIP: ${{ secrets[format('PROXYIP_{0}', matrix.index)] || secrets.PROXYIP }}
        run: |
          if [ -n "$INPUT_PROXYIP" ]; then
            PROXY_VALUE="$INPUT_PROXYIP"
          elif [ -n "$SECRET_PROXYIP" ]; then
            PROXY_VALUE="$SECRET_PROXYIP"
          else
            PROXY_VALUE="di.nscl.ir"
          fi
          echo "proxyip=$PROXY_VALUE" >> "$GITHUB_OUTPUT"

      - name: ⬜ Resolve Placement (Gemini & Google AI Studio)
        id: placementval
        env:
          INPUT_ENABLE: ${{ inputs.enable_gemini }}
          SECRET_ENABLE: ${{ secrets.ENABLE_GEMINI }}
        run: |
          KEY=""
          VALUE=""
          SUMMARY="Disabled"

          if [ "$INPUT_ENABLE" = "true" ] || [ "$SECRET_ENABLE" = "true" ]; then
            KEY="region"
            VALUE="gcp:us-central1"
            SUMMARY="Enabled (Google AI Studio & Gemini support — gcp:us-central1)"
          fi

          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: ⬜ Resolve worker name
        id: worker
        env:
          INPUT_WORKERNAMES: ${{ inputs.workernames }}
          ACCOUNT_INDEX: ${{ matrix.index }}
          SECRET_WORKERNAME: ${{ matrix.index == 1 && secrets.WORKERNAME || secrets[format('WORKERNAME_{0}', matrix.index)] }}
        run: |
          DEFAULT_NAME=$(grep -m1 '^name' wrangler.toml | sed -E 's/name[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          NAME=$(echo "$INPUT_WORKERNAMES" | awk -F',' -v i="$ACCOUNT_INDEX" '{print $i}' | tr -d '[:space:]')
          if [ -z "$NAME" ]; then NAME="$SECRET_WORKERNAME"; fi
          if [ -z "$NAME" ]; then NAME="$DEFAULT_NAME"; fi
          if ! [[ "$NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error::Invalid worker name. Use lowercase letters, digits and hyphens only."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: ⬜ Encode panel
        run: base64 -w0 index.html > src/panel.b64

      - name: ⬜ Apply Placement Hint
        if: steps.placementval.outputs.key != ''
        run: |
          {
            echo ""
            echo "[placement]"
            echo "${{ steps.placementval.outputs.key }} = \"${{ steps.placementval.outputs.value }}\""
          } >> wrangler.toml

      - name: "⬜ Deploy via Wrangler Action (${{ steps.worker.outputs.name }} → ${{ steps.account.outputs.label }})"
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ matrix.index == 1 && secrets.CLOUDFLARE_API_TOKEN || secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.index)] }}
          accountId: ${{ matrix.index == 1 && secrets.CLOUDFLARE_ACCOUNT_ID || secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.index)] }}
          command: deploy --name ${{ steps.worker.outputs.name }}
          vars: |
            UUID
            PROXYIP
            WORKERNAME
        env:
          UUID: ${{ steps.uuidval.outputs.uuid }}
          PROXYIP: ${{ steps.proxyval.outputs.proxyip }}
          WORKERNAME: ${{ steps.worker.outputs.name }}

      - name: ⬜ Deployment Summary
        run: |
          BASE_URL="${{ steps.deploy.outputs.deployment-url }}"
          BASE_URL="${BASE_URL%/}"
          {
            echo "## 🟢 Deployment Successful — ${{ steps.account.outputs.label }}"
            echo ""
            echo "### 📥 Deployment"
            echo ""
            echo "| **Property** | **Value** |"
            echo "|:-------------|:----------|"
            echo "| **Account** | ${{ steps.account.outputs.label }} (slot ${{ matrix.index }}) |"
            echo "| **Worker** | \`${{ steps.worker.outputs.name }}\` |"
            echo "| **Base URL** | $BASE_URL |"
            echo "| **Status** | Deployed successfully |"
            echo ""
            echo "<br/>"
            echo ""
            echo "### ⚙️ Configuration"
            echo ""
            echo "| **Property** | **Value** |"
            echo "|:-------------|:----------|"
            echo "| **PROXYIP** | \`${{ steps.proxyval.outputs.proxyip }}\` |"
            echo "| **UUID** | \`${{ steps.uuidval.outputs.uuid_masked }}\` |"
            echo "| **Google AI Studio** | ${{ steps.placementval.outputs.summary }} |"
            echo ""
            echo "<br/>"
            echo ""
            echo "### 🔐 Access to panel"
            echo ""
            echo "Your UUID is not displayed because this repository is public."
            echo ""
            echo "**To access the panel:**"
            echo ""
            echo "\`$BASE_URL/<UUID>\`"
            echo ""
            echo "#### Get your UUID from:"
            echo ""
            echo "→ Cloudflare Dashboard"
            echo "→ Workers & Pages"
            echo "→ **${{ steps.worker.outputs.name }}**"
            echo "→ Settings"
            echo "→ Variables and Secrets"
            echo ""
            echo "⛅ [**Open cloudflare Dashboard**](https://dash.cloudflare.com/?to=/:account/workers/services/view/${{ steps.worker.outputs.name }}/production/settings)"
          } >> "$GITHUB_STEP_SUMMARY"
