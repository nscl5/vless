port: 7890
socks-port: 7891
mixed-port: 10801
ipv6: false
allow-lan: true
mode: rule
log-level: warning
disable-keep-alive: false
keep-alive-idle: 10
keep-alive-interval: 15
unified-delay: true
geo-auto-update: false
external-ui: /path/to/ui/folder/
external-controller-unix: mihomo.sock
external-ui-name: xd
external-controller: 0.0.0.0:9093
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  use-system-hosts: false
  nameserver:
    - https://8.8.8.8/dns-query
    - https://94.140.14.14/dns-query
    - https://208.67.222.222/dns-query
  default-nameserver:
    - 8.8.8.8
    - 223.5.5.5
    - system
  nameserver-policy:
    raw.githubusercontent.com: 8.8.8.8
    time.apple.com: 8.8.8.8
    www.gstatic.com: system
  proxy-server-nameserver:
    - 8.8.8.8
    - 223.5.5.5
  fallback:
    - tls://1.1.1.1
    - tcp://8.8.8.8
    - udp://223.5.5.5
    - tls://dns.quad9.net
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - geosite:private
tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 9000
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
        - 2052
        - 2082
        - 2086
        - 2095
    TLS:
      ports:
        - 443
        - 8443
        - 2053
        - 2083
        - 2087
        - 2096
proxies:
  - name: Domain1-TLS
    type: vless
    server: 125.xcs.workers.dev
    port: 8443
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: true
    servername: 125.xcs.workers.dev
    alpn:
      - http/1.1
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /ErXMYn1Y4KfWzV4g2U
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
    skip-cert-verify: true
  - name: Domain2-TLS
    type: vless
    server: creativecommons.org
    port: 8443
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: true
    servername: 125.xcs.workers.dev
    alpn:
      - http/1.1
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /Knqzr1R7Ze1jmltO57
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
    skip-cert-verify: true
  - name: IP1-TLS
    type: vless
    server: 104.27.196.85
    port: 443
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: true
    servername: 125.xcs.workers.dev
    alpn:
      - http/1.1
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /9YxLupy0mVEUqFeLY7
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
    skip-cert-verify: true
  - name: IP1-TCP
    type: vless
    server: 104.27.196.85
    port: 2086
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: false
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /OarDsBIDAEqflJpfdB
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
  - name: IP2-TLS
    type: vless
    server: 172.67.158.240
    port: 443
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: true
    servername: 125.xcs.workers.dev
    alpn:
      - http/1.1
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /NFy1328mqCJSHyNq2d
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
    skip-cert-verify: true
  - name: IP2-TCP
    type: vless
    server: 172.67.158.240
    port: 2082
    uuid: c84b1d08-1e9e-4e1c-977a-c7fff6ccb8ec
    tls: false
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /SX3YwTzu1rAxzXg1ja
      headers:
        host: 125.xcs.workers.dev
      max-early-data: 2560
      early-data-header-name: Sec-WebSocket-Protocol
    udp: true
proxy-groups:
  - name: ⚪ 0x00
    type: select
    proxies:
      - 🟢 AUTO
      - DIRECT
      - Domain1-TLS
      - Domain2-TLS
      - IP1-TLS
      - IP1-TCP
      - IP2-TLS
      - IP2-TCP
  - name: 🟢 AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - Domain1-TLS
      - Domain2-TLS
      - IP1-TLS
      - IP1-TCP
      - IP2-TLS
      - IP2-TCP
rules:
  - MATCH,⚪ 0x00
ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
